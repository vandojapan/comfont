[package]
name = "compositefont-editor-plugin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "compositefont_editor"
crate-type = ["cdylib", "rlib"]

[dependencies]
aviutl2.workspace = true
compositefont-core.workspace = true
compositefont-module-plugin.workspace = true
serde_json.workspace = true
windows.workspace = true
ttf-parser = "0.25.1"

[features]
default = []
# Compatibility alias: egui is always enabled.
egui-ui = []

[dependencies.eframe]
version = "=0.33.0"
default-features = false
features = ["default_fonts", "glow", "wgpu", "accesskit"]

[dependencies.winit]
version = "0.30.13"
default-features = false

[target.'cfg(windows)'.dependencies]
# eframe/egui-wgpu disables wgpu's default features. Enable the Windows APIs
# explicitly so an eframe build always has native adapters to request.
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan"] }
