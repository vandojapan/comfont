[package]
name = "compositefont-module-plugin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "compositefont_module"
crate-type = ["rlib"]

[dependencies]
anyhow.workspace = true
aviutl2.workspace = true
aviutl2-alias.workspace = true
compositefont-core.workspace = true
serde_json.workspace = true
windows.workspace = true

unicode-segmentation = "=1.13.3"
icu_properties = "=2.3.0"
windows-core = "=0.62.2"
windows-numerics = "=0.3.1"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data", "utf8_iter"] }

[dev-dependencies]
libloading = "=0.8.9"
