[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/editor-plugin",
    "crates/module-plugin",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.102"
aviutl2 = { version = "=0.50.0", default-features = false, features = ["filter", "generic", "module", "wrap_log"] }
aviutl2-alias = "=0.40.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
compositefont-core = { path = "crates/core" }
compositefont-module-plugin = { path = "crates/module-plugin" }
