#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。
[project]
id = "vandojapan.comfont"
name = "comfont"
version = "0.3.2"

[development]
aviutl2_version = "latest"

[catalog]
id = "vandojapan.comfont"
description_path = "readme.md"
download_repo = { owner = "vandojapan", repo = "comfont" }

[artifacts.compositefont-editor-aux2]
destination = "Plugin/comfont.aux2"
placement_method = "copy"

[artifacts.compositefont-editor-aux2.profiles.debug]
build = "cargo build -p compositefont-editor-plugin"
source = "target/debug/compositefont_editor.dll"

[artifacts.compositefont-editor-aux2.profiles.release]
build = "cargo build -p compositefont-editor-plugin --release"
source = "target/release/compositefont_editor.dll"

[artifacts.compositefont-test-script]
destination = "Script/@compositefont-test.obj2"
placement_method = "copy"

[artifacts.compositefont-test-script.profiles.debug]
source = "scripts/@compositefont-test.obj2"

[artifacts.compositefont-test-script.profiles.release]
enabled = false

[artifacts.comfont-pipeline-anm2]
destination = "Script/@comfont.anm2"
placement_method = "copy"

[artifacts.comfont-pipeline-anm2.profiles.debug]
source = "scripts/@comfont.anm2"

[artifacts.comfont-pipeline-anm2.profiles.release]
source = "scripts/@comfont.anm2"

[artifacts.compositefont-subtitle-object]
destination = "Alias/合成フォント字幕.object"
placement_method = "copy"

[artifacts.compositefont-subtitle-object.profiles.debug]
source = "scripts/合成フォント字幕.object"

[artifacts.compositefont-subtitle-object.profiles.release]
source = "scripts/合成フォント字幕.object"

[artifacts.comfont-inline-snippet]
destination = "Plugin/comfont-snippets/decorate-text.lua"
placement_method = "copy"

[artifacts.comfont-inline-snippet.profiles.debug]
source = "scripts/comfont-inline-snippet.lua"

[artifacts.comfont-inline-snippet.profiles.release]
source = "scripts/comfont-inline-snippet.lua"

[artifacts.material-icons-license]
destination = "Plugin/comfont-licenses/material-icons.txt"
placement_method = "copy"

[artifacts.material-icons-license.profiles.debug]
source = "resource/material-icons/LICENSE.txt"

[artifacts.material-icons-license.profiles.release]
source = "resource/material-icons/LICENSE.txt"

[artifacts.lucide-license]
destination = "Plugin/comfont-licenses/lucide.txt"
placement_method = "copy"

[artifacts.lucide-license.profiles.debug]
source = "resource/lucide/LICENSE.txt"

[artifacts.lucide-license.profiles.release]
source = "resource/lucide/LICENSE.txt"

[artifacts.unicode-license]
destination = "Plugin/comfont-licenses/unicode.txt"
placement_method = "copy"

[artifacts.unicode-license.profiles.debug]
source = "resource/unicode/LICENSE.txt"

[artifacts.unicode-license.profiles.release]
source = "resource/unicode/LICENSE.txt"
